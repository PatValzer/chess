<div
  class="m-auto grid max-w-[100%]"
  [class.chessBoard]="cellSize() == 'b' || true"
  cdkDropListGroup
>
  @for (row of chessboardService.cells; track row) {
    @for (cellSignal of row; track $index) {
      <!-- optional row labels -->
      @let cell = cellSignal();
      @if ($index % 8 == 0) {
        <div class="mr-5 flex items-center">
          {{ cell.coordinates.row }}
        </div>
      }
      <!-- draggable piece -->
      <app-cell
        [cell]="cell"
        class="cell ![scroll-snap-type:both_mandatory]"
      ></app-cell>
    }
  }

  <!-- column labels -->
  <div class="text-center text-[15px] cell"></div>
  @for (column of chessboardService.columns; track $index) {
    <div class="text-center text-[15px]">
      {{ column }}
    </div>
  }
</div>

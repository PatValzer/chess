<div
  style="width: calc(100% - 1px); container-type: size"
  (click)="cellClick($event)"
  [style.boxShadow]="boxShadow()"
  [style.--cell-color]="cell().displayColor | cellColorPipe: opacity()"
  cdkDropList
  [id]="'cell-' + cell().coordinates.toString()"
  [cdkDropListData]="cell()"
  [cdkDropListConnectedTo]="allDropListIds()"
  (cdkDropListDropped)="drop($event)"
  class="bg-[var(--cell-color)] overflow-hidden aspect-square relative p-0"
>
  @let piece = cell().piece();
  @if (piece != null) {
    <app-piece
      [piece]="piece"
      [selected]="selectedSquare()?.coordinates?.equals(cell().coordinates) ?? false"
      cdkDrag
      [cdkDragData]="cell()"
      [cdkDragDisabled]="selectedSquare() != null"
      (cdkDragStarted)="onDragStart($event)"
      class="size-full overflow-hidden text-[70cqw]"
    >
      <ng-template cdkDragPreview>
        <div class="size-[100px] text-[60px] md:text-[100px] relative overflow-visible">
          <span
            class="pt-0 mt-[-20px] relative top-[-35px] left-[-50px] size-[100px] flex items-center justify-center"
            [style.color]="piece.pieceColor | pieceColorPipe"
          >
            {{ piece.pieceSymbol | pieceTypePipe }}
          </span>
        </div>
      </ng-template>
    </app-piece>
  }
</div>

<div [style.backgroundColor]="(data.currentColor == 'w' ? 'b' : 'w') | pieceColorPipe">
  <h3 mat-dialog-title [style.color]="data.currentColor | cellColorPipe: 1">{{ data.title }}</h3>
  <div
    mat-dialog-content
    [style.backgroundColor]="(data.currentColor == 'w' ? 'b' : 'w') | cellColorPipe: 0.8"
  >
    @for (item of pieces; track $index) {
      <app-piece
        [selected]="false"
        [piece]="item"
        class="pt-5 inline-block text-[60px] md:text-[100px]"
        [style.color]="item.pieceColor | pieceColorPipe"
        (click)="closeDialog(item)"
      ></app-piece>
    }
  </div>
</div>
